site_name: Tech Interview Prep Solutions
site_description: Worked solution write-ups for every Grind 75 and NeetCode 150 problem and a growing share of the Amazon OA bank, plus pattern guides, interview prep, and system design material
site_url: https://thodha.github.io/tech-interview-prep/
repo_url: https://github.com/ThoDHa/tech-interview-prep
repo_name: ThoDHa/tech-interview-prep
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  _TEMPLATE.md

# The practice/ workspace is for local repo use, not the deployed site. A build
# hook strips the per-problem "Practice:" line from rendered pages (it stays in
# the source for repo navigation), so the relative link never reaches the site.
hooks:
  - scripts/mkdocs-hooks/strip_practice.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  # Recurrence relations and closed forms are written as LaTeX. `generic: true`
  # emits plain \(...\) / \[...\] spans that the MathJax bundle below typesets,
  # rather than binding the output to one specific math renderer.
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets

plugins:
  - search

extra_css:
  - leetcode/stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort-init.js
  - javascripts/table-filter.js

