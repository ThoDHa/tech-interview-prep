# Output configuration
output-file: grind75.pdf
pdf-engine: xelatex

# Document formatting
variables:
  papersize: letter
  geometry:
    - margin=1in
  monofont: "DejaVu Sans Mono"
  monofontoptions:
    - Scale=0.85
  linkcolor: blue
  listings: true
  breaklines: true

# Table of contents configuration  
toc: true
toc-depth: 1

# Resource paths for images and assets
resource-path: ["./leetcode/"]

# Document metadata
metadata:
  title: "Grind75"
