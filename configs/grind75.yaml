# Grind 75 + NeetCode 150 Study Guide PDF Configuration
# 
# This Pandoc configuration file compiles all 75 algorithm problems
# from the Grind75 study guide into a single comprehensive PDF document.
# 
# Usage: pandoc --defaults grind75.yaml
#
# Prerequisites:
# - Pandoc (universal document converter)
# - XeLaTeX distribution for PDF generation
# - DejaVu Sans Mono font for code formatting

input-files:
  - leetcode/two_sum.md
  - leetcode/valid_parentheses.md
  - leetcode/merge_two_sorted_lists.md
  - leetcode/best_time_to_buy_and_sell_stock.md
